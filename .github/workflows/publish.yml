# iven-infra CD：手动触发，输入版本号 → 构建测试 → 部署 GitHub Packages → 回打 git tag
# 注意：GitHub Packages 不允许覆盖已发布版本，每次触发请使用新版本号。
name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（如 0.1.0，不带 v 前缀；jar/pom/tag 均使用该版本）'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure mvnw is executable
        run: chmod +x mvnw

      - name: Validate version format
        run: |
          VERSION="${{ inputs.version }}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "❌ 版本号格式非法: $VERSION（期望如 0.1.0 或 0.1.0-rc.1）"
            exit 1
          fi
          echo "Release version: $VERSION"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Align version (pom → 输入版本号，jar 版本随之生效)
        run: ./mvnw -B versions:set -DnewVersion="${{ inputs.version }}" -DgenerateBackupPoms=false

      - name: Verify (compile + test)
        run: ./mvnw -B clean verify

      - name: Deploy to GitHub Packages
        run: ./mvnw -B deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup SSH deploy key
        env:
          RELEASE_SSH_KEY: ${{ secrets.RELEASE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$RELEASE_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git config core.sshCommand "ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes"

      - name: Commit version bump, tag and push (deploy key bypasses ruleset)
        run: |
          git config user.name "IVEN-CN"
          git config user.email "13377529851@qq.com"
          git remote set-url origin git@github.com:IVEN-CN/iven-infra.git
          git add "**/pom.xml" "pom.xml"
          git commit -m "chore: release v${{ inputs.version }}"
          git tag "v${{ inputs.version }}"
          git push origin HEAD --tags

      - name: Create GitHub Release
        run: |
          gh release create "v${{ inputs.version }}" \
            --title "v${{ inputs.version }}" \
            --generate-notes \
            */target/*.jar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

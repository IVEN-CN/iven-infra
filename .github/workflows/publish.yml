# iven-infra 发布：推送 v* tag 时部署到 GitHub Packages 并创建 Release
# 也可 workflow_dispatch 手动触发（可选指定 dry-run：只构建不部署）
name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: '仅构建验证，不部署'
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          # 部署到 GitHub Packages 使用 GITHUB_TOKEN 认证
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Resolve version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "Release version: $TAG"
          ./mvnw -B versions:set -DnewVersion="$TAG" -DgenerateBackupPoms=false

      - name: Verify before publish
        run: ./mvnw -B clean verify

      - name: Deploy to GitHub Packages
        if: ${{ !inputs.dry_run }}
        run: ./mvnw -B deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && !inputs.dry_run
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            */target/*.jar

# iven-infra CD：手动触发，输入版本号 → 构建测试 → 部署 GitHub Packages → 回打 git tag
# 注意：GitHub Packages 不允许覆盖已发布版本，每次触发请使用新版本号。
name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（如 0.1.0，不带 v 前缀；jar/pom/tag 均使用该版本）'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure mvnw is executable
        run: chmod +x mvnw

      - name: Validate version format
        run: |
          VERSION="${{ inputs.version }}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "❌ 版本号格式非法: $VERSION（期望如 0.1.0 或 0.1.0-rc.1）"
            exit 1
          fi
          echo "Release version: $VERSION"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Align version (pom → 输入版本号，jar 版本随之生效)
        run: ./mvnw -B versions:set -DnewVersion="${{ inputs.version }}" -DgenerateBackupPoms=false

      - name: Verify (compile + test)
        run: ./mvnw -B clean verify

      - name: Deploy to GitHub Packages
        run: ./mvnw -B deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release branch with version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "release/v${{ inputs.version }}"
          git add "**/pom.xml" "pom.xml"
          git commit -m "chore: release v${{ inputs.version }}"
          git push origin "release/v${{ inputs.version }}"

      - name: Open PR and wait for CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create --base main --head "release/v${{ inputs.version }}" \
            --title "chore: release v${{ inputs.version }}" \
            --body "CD 自动发布的版本对齐提交（v${{ inputs.version }}）"
          gh pr checks "release/v${{ inputs.version }}" --watch --interval 10

      - name: Merge release PR (squash)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "release/v${{ inputs.version }}" --squash --delete-branch
          git fetch origin main
          git checkout origin/main

      - name: Create tag on merged main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - name: Create GitHub Release
        run: |
          gh release create "v${{ inputs.version }}" \
            --title "v${{ inputs.version }}" \
            --generate-release-notes \
            */target/*.jar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
